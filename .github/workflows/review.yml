# 리뷰봇 호출 파일 — 리뷰받을 저장소의 .github/workflows/review.yml 로 복사한다
# 필요한 시크릿(저장소마다): REVIEW_BOT_TOKEN, CLAUDE_CODE_OAUTH_TOKEN
# 리뷰 시작: PR의 Reviewers에 im-pine-bot 지정 / 한도 추가: im-pine 계정으로 "/review-quota +N" 코멘트
name: review-bot

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, review_requested]
  issue_comment:
    types: [created]
  schedule:
    - cron: "5 15 * * *" # 한국 시간 0시 5분: 한도 때문에 밀린 PR 다시 리뷰
  workflow_dispatch:
    inputs:
      pr:
        description: "리뷰할 PR 번호"
        required: true

permissions:
  contents: read

jobs:
  review:
    uses: im-pine/review-bot/.github/workflows/review.yml@main
    with:
      manual_pr: ${{ inputs.pr || '' }}
    secrets:
      REVIEW_BOT_TOKEN: ${{ secrets.REVIEW_BOT_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
